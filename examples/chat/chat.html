<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wshub chat example</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #161f32;
    --panel-2: #1c2740;
    --border: #2a3652;
    --text: #e5eaf3;
    --muted: #8b97ad;
    --accent: #38bdf8;
    --accent-hover: #5fcdff;
    --good: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 500px at 15% -10%, #14203a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .page { width: 100%; max-width: 960px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #0b1220;
    flex-shrink: 0;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px 5px 8px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.is-open .status-dot { background: var(--good); box-shadow: 0 0 0 3px rgba(52,211,153,.15); }
  .status.is-closed .status-dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(248,113,113,.15); }
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 12px 32px -16px rgba(0,0,0,.5);
  }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .side { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .side .panel { padding: 12px 14px; }
  .side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .side ul { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .side li { padding: 3px 0; color: var(--text); }
  .side li.system { color: var(--muted); font-style: italic; }
  #log {
    height: 320px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  #log .line { padding: 2px 0; }
  #log .system { color: var(--muted); font-style: italic; }
  #log .me { color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  #setup.row { margin-top: 0; margin-bottom: 12px; }
  input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 13px;
    transition: border-color .15s ease;
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); }
  #username, #room { flex: 1; }
  #msg { flex: 1; }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, transform .05s ease;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  /* Labels are visually hidden - the placeholders carry the visual cue, but
     screen readers still get a proper accessible name for every control. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<div class="page">
<div class="header">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div>
      <h1>wshub chat example</h1>
      <p class="sub">Rooms, broadcasting and lifecycle hooks over a plain WebSocket</p>
    </div>
  </div>
  <div id="status" class="status"><span class="status-dot"></span><span id="statusText">connecting…</span></div>
</div>

<div class="layout">
  <div class="panel main">
    <div id="setup" class="row">
      <label class="sr-only" for="username">Your name</label>
      <input id="username" placeholder="Your name" autocomplete="off" autofocus />
      <button id="setUsernameBtn" onclick="setUsername()">Join as</button>
      <label class="sr-only" for="room">Room name</label>
      <input id="room" placeholder="Room (e.g. general)" value="general" />
      <button id="joinBtn" onclick="joinRoom()" disabled>Join room</button>
    </div>

    <div id="log"></div>

    <div class="row">
      <label class="sr-only" for="msg">Message</label>
      <input id="msg" placeholder="Message" disabled />
      <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Rooms</h2>
      <ul id="rooms"><li class="system">none joined</li></ul>
    </div>
    <div class="panel">
      <h2>In room</h2>
      <ul id="users"><li class="system">-</li></ul>
    </div>
  </div>
</div>
</div>

<script>
let username = "";
let currentRoom = "";

// Match the page's scheme: a page served over HTTPS must use wss://, or the
// browser blocks the connection as mixed content.
const wsScheme = location.protocol === "https:" ? "wss://" : "ws://";
const ws = new WebSocket(wsScheme + location.host + "/ws");

// safeSend guards every ws.send() call site: sending before the handshake
// completes or after the socket has closed throws an uncaught
// InvalidStateError, which (since these are plain onclick handlers) would
// silently abort the rest of the function - e.g. leaving the room/message
// controls stuck disabled if it happened inside setUsername().
function safeSend(obj) {
  if (ws.readyState !== WebSocket.OPEN) {
    logLine("not connected - try again in a moment", "system");
    return false;
  }
  ws.send(JSON.stringify(obj));
  return true;
}

// Joining is unlocked by setting a username; messaging is unlocked only once
// a room has actually been joined. Sending with an empty room makes the
// server fall back to a hub-wide Broadcast (see handleChatMessage), which is
// not what a room-based demo should do by accident.
function setJoinEnabled(enabled) {
  document.getElementById("joinBtn").disabled = !enabled;
}

function setMessagingEnabled(enabled) {
  document.getElementById("msg").disabled = !enabled;
  document.getElementById("sendBtn").disabled = !enabled;
}

function setStatus(state, text) {
  const el = document.getElementById("status");
  el.classList.remove("is-open", "is-closed");
  if (state) el.classList.add(state);
  document.getElementById("statusText").textContent = text;
}

ws.onopen = () => {
  setStatus("is-open", "connected");
  logLine("connected", "system");
};
ws.onclose = () => {
  setStatus("is-closed", "disconnected");
  logLine("disconnected", "system");
  setJoinEnabled(false);
  setMessagingEnabled(false);
};
ws.onerror = () => {
  setStatus("is-closed", "connection error");
  logLine("connection error", "system");
};

ws.onmessage = (e) => {
  let m;
  try {
    m = JSON.parse(e.data);
  } catch {
    logLine(e.data, "system");
    return;
  }

  switch (m.type) {
    case "welcome":
      logLine(m.message, "system");
      break;
    case "usernameSet":
      logLine("username set to " + m.message, "system");
      break;
    case "joined":
      currentRoom = m.room;
      setMessagingEnabled(true);
      logLine(m.message, "system");
      requestRooms();
      break;
    case "left":
      logLine(m.message, "system");
      currentRoom = "";
      setMessagingEnabled(false);
      document.getElementById("users").innerHTML = '<li class="system">-</li>';
      requestRooms();
      break;
    case "chat":
      logLine((m.room ? "[" + m.room + "] " : "") + m.from + ": " + m.message);
      break;
    case "notification":
      logLine(m.message, "system");
      break;
    case "rooms":
      renderRooms(m.rooms || []);
      break;
    case "users":
      renderUsers(m.users || []);
      break;
    default:
      logLine(JSON.stringify(m), "system");
  }
};

function setUsername() {
  const el = document.getElementById("username");
  if (!el.value) return;
  if (!safeSend({ type: "setUsername", message: el.value })) return;
  username = el.value;
  setJoinEnabled(true);
}

function joinRoom() {
  const room = document.getElementById("room").value;
  if (!room) return;
  safeSend({ type: "join", room });
}

function sendMessage() {
  const el = document.getElementById("msg");
  if (!el.value) return;
  if (!currentRoom) {
    logLine("join a room first", "system");
    return;
  }
  if (!safeSend({ type: "chat", room: currentRoom, message: el.value })) return;
  logLine("[" + currentRoom + "] you: " + el.value, "me");
  el.value = "";
}

document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

function requestRooms() {
  safeSend({ type: "rooms" });
}

function renderRooms(rooms) {
  const ul = document.getElementById("rooms");
  ul.innerHTML = "";
  if (rooms.length === 0) {
    ul.innerHTML = '<li class="system">none yet</li>';
    return;
  }
  for (const r of rooms) {
    const li = document.createElement("li");
    li.textContent = r.name + " (" + r.userCount + ")";
    ul.appendChild(li);
  }
}

function renderUsers(users) {
  const ul = document.getElementById("users");
  ul.innerHTML = "";
  if (users.length === 0) {
    ul.innerHTML = '<li class="system">-</li>';
    return;
  }
  for (const u of users) {
    const li = document.createElement("li");
    li.textContent = u.username || u.id;
    ul.appendChild(li);
  }
}

function logLine(text, cls) {
  const el = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "line" + (cls ? " " + cls : "");
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
