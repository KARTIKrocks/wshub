name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Runs on main are
# never cancelled — coverage and bench there are the recorded baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (root, go${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -race -count=1 ./...

  # The root module's ./... stops at nested go.mod boundaries, so the adapters
  # and the Prometheus collector get no signal from the `test` job above. Each
  # submodule is tested here at its own declared minimum Go version and at the
  # current release.
  #
  # Each submodule pins a published wshub version in its go.mod. Testing against
  # that pin would only re-test already-released code, so we replace it with the
  # working tree — a breaking change in the root module then fails CI here
  # instead of after it ships.
  submodules:
    name: test (${{ matrix.module }}, go${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: "adapter/redis", go-version: "1.24" }
          - { module: "adapter/redis", go-version: "1.26" }
          - { module: "adapter/nats", go-version: "1.25" }
          - { module: "adapter/nats", go-version: "1.26" }
          - { module: "prometheus", go-version: "1.25" }
          - { module: "prometheus", go-version: "1.26" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Resolve wshub to the working tree
        working-directory: ${{ matrix.module }}
        run: go mod edit -replace github.com/KARTIKrocks/wshub=$GITHUB_WORKSPACE
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  # examples/multinode is its own module and ships no tests; a build is enough
  # to catch API drift in the example code we point users at.
  examples:
    name: build (examples/multinode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Resolve wshub and adapter to the working tree
        working-directory: examples/multinode
        run: |
          go mod edit \
            -replace github.com/KARTIKrocks/wshub=$GITHUB_WORKSPACE \
            -replace github.com/KARTIKrocks/wshub/adapter/redis=$GITHUB_WORKSPACE/adapter/redis
      - name: Build
        working-directory: examples/multinode
        run: go build ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapter/redis", "adapter/nats", "prometheus"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Submodules typecheck against the working tree for the same reason the
      # `submodules` job does; the root module needs no replace.
      - name: Resolve wshub to the working tree
        if: matrix.module != '.'
        working-directory: ${{ matrix.module }}
        run: go mod edit -replace github.com/KARTIKrocks/wshub=$GITHUB_WORKSPACE
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

  # THIS IS THE ONLY JOB THAT SHOULD BE A REQUIRED STATUS CHECK.
  #
  # Requiring the matrix jobs directly is brittle: their check names embed the
  # matrix values, so adding a Go version or renaming a job silently orphans the
  # required context and every PR then blocks forever on a check that no longer
  # exists. Gating on one stable name instead means the matrix is free to change.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when a
  # dependency fails, and GitHub counts a skipped required check as passing —
  # a failing build would report mergeable.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [test, submodules, examples, coverage, lint]
    steps:
      - name: Verify every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "all jobs succeeded"

  # Not part of the `ci` gate: this runs only on main, so on a pull request it
  # is skipped and would drag the gate down with it.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go test -bench=. -benchmem ./...
