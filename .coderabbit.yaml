# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for wshub (github.com/KARTIKrocks/wshub)
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false

reviews:
  # "assertive" surfaces more substantive feedback than the default "chill".
  # Good for a library where API quality and correctness matter.
  profile: assertive

  # Don't block merges; CI (vet/lint/test) is the gate. CodeRabbit advises.
  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: true

  # Report review status as a GitHub commit status, but never fail the build.
  review_status: true
  commit_status: true
  fail_commit_status: false

  suggested_reviewers: true
  suggested_labels: true
  auto_apply_labels: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    # Skip release/automation PRs that don't need a human-style review.
    ignore_title_keywords:
      - "wip"
      - "release"
    ignore_usernames:
      - "dependabot[bot]"

  # Let the bot offer docstrings and test scaffolding, but not auto-simplify.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Exclude noise from review scope. CodeRabbit still has full repo context.
  path_filters:
    - "!**/mock_*.go"
    - "!**/*_mock.go"
    - "!**/testdata/**"
    - "!**/go.sum"
    - "!**/vendor/**"

  # Package-aware guidance so reviews match this library's conventions.
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Idiomatic Go review for a concurrent WebSocket hub library. Verify
        errors are wrapped with %w and never silently ignored. Check that
        exported identifiers have doc comments starting with the identifier
        name. Pay special attention to concurrency: flag goroutine leaks,
        missing context.Context propagation, data races on shared state,
        channel sends that can block or panic on a closed channel, and locks
        held across blocking calls. Ensure every connection and goroutine has
        a clear shutdown path. Prefer the standard library and avoid new
        third-party dependencies in the core package.
    - path: "**/*_test.go"
      instructions: >-
        Prefer table-driven tests and t.Parallel() where safe. Tests must be
        deterministic and run cleanly under -race; flag time.Sleep-based
        synchronization in favor of channels or sync primitives. Use
        t.Cleanup for teardown. Flag assertions that don't actually test
        behavior.
    - path: "adapter/**/*.go"
      instructions: >-
        These are distributed pub/sub backends (NATS, Redis). Scrutinize
        connection lifecycle, reconnection and retry handling, subscription
        cleanup, and propagation of backend errors. Ensure context
        cancellation is honored and no messages are silently dropped.
    - path: "router.go"
      instructions: >-
        Check handler dispatch, middleware ordering, and panic recovery so a
        single bad handler cannot take down the hub. Confirm unmatched message
        types and error paths are covered.
    - path: "examples/**"
      instructions: >-
        Examples are illustrative; relax error-handling strictness but ensure
        they compile and demonstrate correct API usage.

  tools:
    # Reuse the repo's existing golangci-lint v2 ruleset; no duplication.
    golangci-lint:
      enabled: true
      config_file: .golangci.yml
    # Secret scanning on every PR.
    gitleaks:
      enabled: true
    # Lint GitHub Actions workflows and Markdown docs.
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  # Learn this repo's review patterns over time and pull in linked issues/PRs.
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  web_search:
    enabled: true
