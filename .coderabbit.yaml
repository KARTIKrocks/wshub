# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for wshub (github.com/KARTIKrocks/wshub)
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false

reviews:
  # "assertive" surfaces more substantive feedback than the default "chill".
  # Good for a library where API quality and correctness matter.
  profile: assertive

  # Don't block merges; CI (vet/lint/test) is the gate. CodeRabbit advises.
  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: true

  # Report review status as a GitHub commit status, but never fail the build.
  review_status: true
  commit_status: true
  fail_commit_status: false

  suggested_reviewers: true
  suggested_labels: true
  auto_apply_labels: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    # Skip release/automation PRs that don't need a human-style review.
    ignore_title_keywords:
      - "wip"
      - "release"
    ignore_usernames:
      - "dependabot[bot]"

  # Let the bot offer docstrings and test scaffolding, but not auto-simplify.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Exclude noise from review scope. CodeRabbit still has full repo context.
  path_filters:
    - "!**/mock_*.go"
    - "!**/*_mock.go"
    - "!**/testdata/**"
    - "!**/go.sum"
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!benchmarks/profiles/**"
    - "!benchmarks/results/**"
    # Frozen snapshots of website/docs taken at release time. A docs change
    # lands in website/docs only — snapshots are produced by cut-version and
    # are never hand-edited, so any suggestion here is unactionable by
    # definition: a published snapshot documents the behaviour of a shipped
    # version, and changing it rewrites history for users still on it.
    - "!website/versioned_docs/**"
    - "!website/versioned_sidebars/**"
    # Generated raster assets and the logo SVGs; nothing to review as text.
    - "!website/static/**"

  # Package-aware guidance so reviews match this library's conventions.
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Idiomatic Go review for a concurrent WebSocket hub library. Verify
        errors are wrapped with %w and never silently ignored. Check that
        exported identifiers have doc comments starting with the identifier
        name. Pay special attention to concurrency: flag goroutine leaks,
        missing context.Context propagation, data races on shared state,
        channel sends that can block or panic on a closed channel, and locks
        held across blocking calls. Ensure every connection and goroutine has
        a clear shutdown path. Prefer the standard library and avoid new
        third-party dependencies in the core package.
    - path: "**/*_test.go"
      instructions: >-
        Prefer table-driven tests and t.Parallel() where safe. Tests must be
        deterministic and run cleanly under -race; flag time.Sleep-based
        synchronization in favor of channels or sync primitives. Use
        t.Cleanup for teardown. Flag assertions that don't actually test
        behavior.
    - path: "adapter/**/*.go"
      instructions: >-
        These are distributed pub/sub backends (NATS, Redis). Scrutinize
        connection lifecycle, reconnection and retry handling, subscription
        cleanup, and propagation of backend errors. Ensure context
        cancellation is honored and no messages are silently dropped.
    - path: "router.go"
      instructions: >-
        Check handler dispatch, middleware ordering, and panic recovery so a
        single bad handler cannot take down the hub. Confirm unmatched message
        types and error paths are covered.
    - path: "hub.go"
      instructions: >-
        The dispatch loop, connection registration and shutdown/draining path.
        Never suggest closing a client's send channel: producers send on it
        without holding a lock a closer could take, so closing races with them.
        Shutdown is signalled through client.done, writePump flushes on a
        graceful close, and handleUnregister drains the buffer. Verify new
        registry mutations hold the right lock and that no lock is held across
        a channel send or a network write.
    - path: "client.go"
      instructions: >-
        Per-connection read and write pumps. gorilla/websocket allows only one
        concurrent writer and one concurrent reader per connection, so flag any
        write that bypasses writePump. Do not suggest closing the send channel
        (see hub.go). Check that every deadline, ping/pong handler and error
        path still terminates both pumps exactly once.
    - path: "presence.go"
      instructions: >-
        Cross-node presence gossip. Counts are eventually consistent by design;
        flag anything that presents them as exact, and check for unbounded
        growth when a peer node disappears without a leave message.
    - path: "cmd/**"
      instructions: >-
        Developer tooling (the load generator), not part of the public API or
        the coverage target. Review for correctness of the measurements it
        reports; relax error-handling and style strictness.
    - path: "examples/**"
      instructions: >-
        Examples are illustrative; relax error-handling strictness but ensure
        they compile and demonstrate correct API usage. They are copied by
        users, so still flag missing http.Server timeouts and other unsafe
        defaults.
    - path: "website/docs/**"
      instructions: >-
        Docusaurus source for the unreleased docs. Verify every Go snippet
        compiles against the current API and that option names match the
        exported identifiers exactly — a wrong option name here is a support
        burden, not a typo. This site is versioned by snapshot, not per
        release: additive changes are marked inline instead of being
        snapshotted, so check that anything documenting a new API carries its
        version marker — `_1.8+_` appended to an API table's description cell,
        `_Added in 1.8._` opening a prose paragraph, or a trailing `// 1.8+`
        comment inside a code block. Behaviour that changed takes
        `_Changed in 1.8._` plus a line on what it was before. See
        website/VERSIONING.md rules 1 and 2. Do not suggest edits to
        website/versioned_docs; those are frozen release snapshots.

  tools:
    # Reuse the repo's existing golangci-lint v2 ruleset; no duplication.
    golangci-lint:
      enabled: true
      config_file: .golangci.yml
    # Secret scanning on every PR.
    gitleaks:
      enabled: true
    # Lint GitHub Actions workflows and Markdown docs.
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  # Learn this repo's review patterns over time and pull in linked issues/PRs.
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  web_search:
    enabled: true
